name: Build check (no deploy)

# Verifies that main builds with npm and that the shipped api/ data has no
# structural corruption (parse errors / NaN / Inf). Runs on push and PR; the
# deploy workflow handles publishing separately.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci || npm install
      - name: API data integrity (strict, structural only)
        run: python3 scripts/check_api_integrity.py public/api --strict
      - name: Build
        run: npm run build
      - name: Report dist size
        run: |
          if [ -d dist ]; then
            echo "dist/ contents:"
            du -sh dist
            ls -lh dist | head -20
          else
            echo "dist/ not produced"
            exit 1
          fi
